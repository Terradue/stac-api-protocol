[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "stac-api-protocol"
dynamic = ["version"]
description = "A Python FastAPI HTTP adapter for STAC API Core, Item Search, Features and Collections."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Terradue", email = "info@terradue.com" },
]
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "cql2json-pydantic>=0.2.0",
  "geojson==3.3.0",
  "pystac>=1.14,<2",
  "fastapi>=0.162.4",
]

# ---------------------------------------------------------------------------
# Project Refs
# ---------------------------------------------------------------------------

[project.urls]
Documentation = "https://terradue.github.io/stac-api-protocol/"
Issues = "https://github.com/Terradue/stac-api-protocol/issues"
Source = "https://github.com/Terradue/stac-api-protocol"
Changelog = "https://github.com/Terradue/stac-api-protocol/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Versioning and packaging
# ---------------------------------------------------------------------------

[tool.hatch.version]
path = "src/stac_api_protocol/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/demo",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stac_api_protocol"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source_pkgs = ["stac_api_protocol", "tests"]
branch = true
parallel = true
omit = [
  "src/stac_api_protocol/__about__.py",
]

[tool.coverage.paths]
stac_api_protocol = [
  "src/stac_api_protocol",
  "*/stac-api-protocol/src/stac_api_protocol"
]

[tool.coverage.report]
show_missing = true
skip_covered = false

exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# Hatch: test environment
# ---------------------------------------------------------------------------

[tool.hatch.envs.test]
skip-install = false
dependencies = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "stac-api-protocol-demo @ {root:uri}/demo",
]

[tool.hatch.envs.test.env-vars]
PYTHONPATH = "{root}/demo"

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
testv = "pytest --verbose {args:tests}"
test-cov = "pytest --cov=stac_api_protocol --cov-report=term-missing --cov-report=xml:coverage.xml {args:tests}"
test-show-setup = "pytest --setup-show {args:tests}"

[[tool.hatch.envs.test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14", "3.15"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "tests_*.py"]

addopts = [
  "--strict-config",
  "--strict-markers",
]

xfail_strict = true

# ---------------------------------------------------------------------------
# Hatch: development and quality environment
# ---------------------------------------------------------------------------

[tool.hatch.envs.dev]
skip-install = false
dependencies = [
  "stac-api-protocol-demo @ {root:uri}/demo",
  "mypy==2.4.1",
  "types-geojson==3.3.0.20261006",
  "ruff==0.17.4",
  "bandit==1.9.4",
  "pytest==9.2.0",
]

[tool.hatch.envs.dev.env-vars]
PYTHONPATH = "{root}/demo"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Start with the essential rules
select = [
  # Core correctness
  "F",      # Pyflakes
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings

  # Imports and modernization
  "I",      # isort
  "UP",     # pyupgrade
  "FA",     # future annotations
  "TC",     # type-checking imports

  # Bugs and correctness
  "B",      # flake8-bugbear
  "RET",    # flake8-return
  "PTH",    # pathlib usage
  "C4",     # comprehensions

  # Simplification and readability
  "SIM",    # flake8-simplify

  # Complexity
  "C90",    # McCabe complexity

  # Pylint-derived checks
  "PLE",    # Pylint errors
  "PLW",    # Pylint warnings
  "PLR",    # Pylint refactor/design checks

  # Performance and Ruff-specific quality checks
  "PERF",
  "RUF",
]

ignore = [
  # Formatter-controlled rules
  "E501",   # line length
  "W191",   # tab indentation
  "E111",   # indentation
  "E114",   # indentation
  "E117",   # over-indented

  # Too opinionated for a general project template.
  # Enable per repository if useful.
  # "PLR0904", # too many public methods
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI consumes these defaults as declaration metadata, not per-request state.
# Preserve generated route signatures while retaining B008 for other calls.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# OpenAPI-generated signatures and HTTP status literals mirror the API schema.
"src/stac_api_protocol/**/*.py" = ["PLR0913", "PLR2004"]
# Implementations must preserve the protocol's search method signature.
"demo/stac_api_demo/service.py" = ["PLR0913"]

[tool.ruff.lint.mccabe]
# Flag errors (C901) whenever complexity exceeds 10 (default is 10)
max-complexity = 7

[tool.ruff.lint.pylint]
# Keep these deliberately stricter than Pylint defaults.
max-args = 10
max-branches = 10
max-returns = 6
max-statements = 40

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]

# Strict typing is the default for new Terradue Python projects.
strict = true
# Attribute's constructor is unannotated upstream; its input is a field name.
untyped_calls_exclude = ["pygeofilter.ast.Attribute"]

# Improve diagnostics.
pretty = true
show_error_codes = true
show_error_context = true
warn_unreachable = true

# Avoid silently accepting untyped third-party APIs.
ignore_missing_imports = false

# Files checked by default.
files = [
  "src/stac_api_protocol",
  "tests",
  "demo/stac_api_demo"
]

# These dependencies ship annotations but do not declare a py.typed marker.
[[tool.mypy.overrides]]
module = ["pygeofilter.*", "pygeofilter_duckdb.*"]
follow_untyped_imports = true

[tool.hatch.envs.dev.scripts]
# ---------------------------------------------------------------------------
# Developer commands
#
# These commands are allowed to modify files.
# ---------------------------------------------------------------------------

format = "ruff format {args:src tests demo/stac_api_demo}"

fix = [
  "ruff check --fix {args:src tests demo/stac_api_demo}",
  "ruff format {args:src tests demo/stac_api_demo}",
]

# ---------------------------------------------------------------------------
# Verification commands
#
# These commands MUST NOT modify files and are suitable for CI.
# ---------------------------------------------------------------------------

format-check = "ruff format --check {args:src tests demo/stac_api_demo}"

lint = "ruff check {args:src tests demo/stac_api_demo}"
lint-check = "ruff check {args:src tests demo/stac_api_demo}"
design-check = "ruff check --select C90,PLR {args:src tests demo/stac_api_demo}"

typecheck = "mypy {args:src tests demo/stac_api_demo}"

security = "bandit -r {args:src demo/stac_api_demo}"

# Run the complete static quality gate.
quality = [
  "ruff format --check {args:src tests demo/stac_api_demo}",
  "ruff check {args:src tests demo/stac_api_demo}",
  "mypy {args:src tests demo/stac_api_demo}",
  "bandit -r {args:src demo/stac_api_demo}",
]

# Complete local/CI validation including tests.
check = [
  "ruff format --check {args:src tests demo/stac_api_demo}",
  "ruff check {args:src tests demo/stac_api_demo}",
  "mypy {args:src tests demo/stac_api_demo}",
  "bandit -r {args:src demo/stac_api_demo}",
  "pytest {args:tests}",
]

# Preserve editable-install test extras and uv's local wheel resolution.
[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0"
]
