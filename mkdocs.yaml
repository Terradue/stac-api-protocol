site_name: STAC API Protocol
site_description: A Python FastAPI HTTP adapter for STAC API Core, Item Search, Features and Collections.
site_url: https://terradue.github.io/stac-api-protocol/
repo_url: https://github.com/Terradue/stac-api-protocol
repo_name: stac-api-protocol
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Build your first service: tutorials/first-steps.md
  - How-to guides:
      - Overview: how-to/index.md
      - Install and run: how-to/install.md
      - Register a service factory: how-to/register-service.md
  - Reference:
      - Overview: reference/index.md
      - Service contract: reference/api.md
      - Bundled OpenAPI: reference/opneapi.html
  - Explanation:
      - Overview: explanation/index.md
      - Architecture: explanation/architecture.md

theme:
  name: readthedocs
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
